<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">U.A. High School concept art</title>
  <desc id="desc">Stylized concept art of U.A. High School with a wide campus and dramatic lighting.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dfeeff"/>
      <stop offset="50%" stop-color="#c8d8ff"/>
      <stop offset="100%" stop-color="#86a7d9"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0%" stop-color="#eaf4ff"/>
      <stop offset="100%" stop-color="#8bb6ff"/>
    </linearGradient>
    <linearGradient id="stone" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dfe7f5"/>
      <stop offset="100%" stop-color="#8fa5bf"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="950" cy="90" r="72" fill="#ffe09d" opacity="0.9"/>
  <path d="M0,500 C200,470 350,500 550,540 C730,576 920,560 1200,500 L1200,800 L0,800 Z" fill="#9fb3d9" opacity="0.7"/>
  <g opacity="0.25">
    <rect x="120" y="210" width="960" height="6" fill="#ffffff"/>
    <rect x="100" y="330" width="1000" height="4" fill="#ffffff"/>
  </g>
  <g transform="translate(200 100)">
    <rect x="0" y="240" width="800" height="280" rx="18" fill="url(#stone)"/>
    <rect x="120" y="120" width="560" height="160" rx="12" fill="#edf3ff"/>
    <rect x="200" y="50" width="390" height="200" rx="16" fill="url(#glass)"/>
    <rect x="250" y="80" width="290" height="140" fill="#b4d1ff" opacity="0.75"/>
    <rect x="440" y="220" width="110" height="220" fill="#d7e7ff"/>
    <rect x="250" y="220" width="110" height="220" fill="#d7e7ff"/>
    <g fill="#90a8cf">
      <rect x="150" y="280" width="70" height="180"/>
      <rect x="580" y="280" width="70" height="180"/>
      <rect x="110" y="240" width="20" height="220"/>
      <rect x="670" y="240" width="20" height="220"/>
    </g>
    <g fill="#ffffff" opacity="0.8">
      <rect x="235" y="100" width="30" height="90"/>
      <rect x="285" y="100" width="30" height="90"/>
      <rect x="335" y="100" width="30" height="90"/>
      <rect x="385" y="100" width="30" height="90"/>
      <rect x="435" y="100" width="30" height="90"/>
      <rect x="485" y="100" width="30" height="90"/>
    </g>
  </g>
  <g opacity="0.3">
    <path d="M0,620 L1200,560 L1200,800 L0,800 Z" fill="#5d76a8"/>
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="170" cy="180" r="12"/>
    <circle cx="230" cy="150" r="9"/>
    <circle cx="280" cy="185" r="7"/>
    <circle cx="1030" cy="170" r="11"/>
    <circle cx="1067" cy="210" r="8"/>
  </g>
</svg>
